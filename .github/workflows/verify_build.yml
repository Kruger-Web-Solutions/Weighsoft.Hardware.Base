name: Build Framework

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:

    # This repo is PUBLIC and the org runner group does not allow public repos
    # (correct: fork PRs must never run on our VMs). Stays GitHub-hosted unless the
    # repo is made private, at which point switch to [self-hosted, Linux, X64, weighsoft-qa].
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    - name: Cache PlatformIO
      uses: actions/cache@v4
      with:
        path: ~/.platformio
        key: ${{ runner.os }}-${{ hashFiles('**/lockfiles') }}
    - name: Set up Python
      uses: actions/setup-python@v5
    - name: Install PlatformIO
      # intelhex: espressif32 >= 6.12 ships esptool 4.9+, which imports intelhex
      # when it builds bootloader.bin. PlatformIO does not install it, so the
      # node32s build failed with "No module named 'intelhex'" (run 32662931921).
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade platformio intelhex
    - name: Run PlatformIO
      # node32s is the framework ESP32 build on the PR #57 pin (espressif32@6.13.0).
      # esp12e compiles, then the link fails: this tree is about 2.6MB and the
      # ESP8266 app slot is about 1MB, so it is not a CI target.
      run: pio run -e node32s

  interface:
    name: Build interface
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: interface/package-lock.json
    - name: Install, test and build the React UI
      working-directory: interface
      run: |
        npm ci
        npm test -- --watchAll=false
        npm run build
