[platformio]
extra_configs = 
  factory_settings.ini
  features.ini
;default_envs = esp12e
default_envs = nodemcu_esp32

[env]
build_flags=
  ${factory_settings.build_flags}
  ${features.build_flags}
  -D NO_GLOBAL_ARDUINOOTA
  ; Uncomment PROGMEM_WWW to enable the storage of the WWW data in PROGMEM
  -D PROGMEM_WWW
  ; Uncomment to configure Cross-Origin Resource Sharing
  ;-D ENABLE_CORS
  ;-D CORS_ORIGIN=\"*\"

; ensure transitive dependencies are included for correct platforms only
lib_compat_mode = strict
; W-Soft board code (Waveshare panel, gitignored ota_secret.h) builds only in
; [env:wsoft_waveshare43]. LDF chain mode ignores #if, so keep it out of every other env.
lib_ignore = wsoft_esp

; OTA upload configuration for ESP32-S3 (uncomment when using wireless OTA)
; Set upload_port to your device IP (check web interface if changed)
;upload_flags =
; --port=8266
; --auth=esp-react
upload_port = 192.168.3.55
upload_protocol = espota

framework = arduino
monitor_speed = 115200

extra_scripts =
 pre:scripts/build_interface.py
 pre:scripts/clear_otadata.py

lib_deps =
  ArduinoJson@>=6.0.0,<7.0.0
  ; The following allows the use of the latest code for ESPAsyncWebServer - there hasn't been a release in a while
  ; Work around for https://github.com/me-no-dev/ESPAsyncWebServer/issues/1151
  https://github.com/me-no-dev/ESPAsyncWebServer
  ;ESP Async WebServer@>=1.2.0,<2.0.0
  AsyncMqttClient@>=0.9.0,<1.0.0
  links2004/WebSockets@^2.5.4
  
[env:esp12e]
platform = espressif8266
board = esp12e
board_build.f_cpu = 160000000L
board_build.filesystem = littlefs

[env:nodemcu_esp32]
; Ai-Thinker NodeMCU-32 (ESP32-S module, CH340C USB-serial) on the bench
; Classic ESP32 dual-core; BLE partition layout (single-app, no OTA via dual slots)
board_build.partitions = partitions_ble.csv
platform = espressif32@6.13.0
board = node32s
board_build.filesystem = littlefs
upload_protocol = esptool
upload_port = COM14
build_flags =
  ${env.build_flags}
  -DCONFIG_ESP_TASK_WDT_TIMEOUT_S=10

[env:firebeetle32]
; DFRobot FireBeetle ESP32 V4.0 (ESP32-WROOM-32D, 4MB flash detected, Li-Ion charger)
board_build.partitions = partitions_ble.csv
platform = espressif32@6.13.0
board = firebeetle32
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.filesystem = littlefs
upload_protocol = esptool
upload_port = COM31
build_flags =
  ${env.build_flags}
  -DCONFIG_ESP_TASK_WDT_TIMEOUT_S=10
  -D FT_BOARD_ESP32_2432S028=1

[env:esp32dev]
; Generic ESP32 development board for troubleshooting.
; Single-app partitions_ble.csv (3.25MB, no OTA): the ~2.6MB trunk firmware
; overflows the 1.5MB dual-OTA slots of partitions_custom.csv (a pre-existing
; mismatch, unrelated to the display work — esp32dev is not in CI so it went
; unnoticed). Same single-app layout as nodemcu/firebeetle and the display envs.
board_build.partitions = partitions_ble.csv
platform = espressif32@6.13.0
board = esp32dev
board_build.filesystem = littlefs
; Increase watchdog timeout and enable verbose output
build_flags =
  ${env.build_flags}
  -DCONFIG_ESP_TASK_WDT_TIMEOUT_S=10
  -DCORE_DEBUG_LEVEL=5

[env:esp32s3]
; ESP32-S3 N16R8 board configuration (16MB flash, 8MB PSRAM)
; Supports native USB, more RAM (512KB + 8MB PSRAM), dual-core
; BLE + OTA supported
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1-n16r8
board_build.filesystem = littlefs
board_build.partitions = partitions_ble_ota.csv
; ESP32-S3 specific settings
build_flags =
  ${env.build_flags}
  -DCONFIG_ESP_TASK_WDT_TIMEOUT_S=10
  ; BLE shares the 2.4 GHz radio with Wi‑Fi; disable on S3 for reliable STA + soft AP (re-enable via features if needed).
  -D FT_BLE=0
  ; ESP-to-ESP weight receiver (bridge target) — NewEspAllInOne display integration.
  -D FT_REMOTE_WEIGHT=1
  ; Enable USB CDC for serial output over native USB
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=0

; USB upload (kept for emergency recovery)
;upload_protocol = esptool
;upload_port = COM11

; USB upload — board on COM2
upload_protocol = esptool
upload_port = COM2

; OTA upload (uncomment when target is reliably on WiFi)
;upload_protocol = espota
;upload_port = 192.168.2.68
;upload_flags =
;  --port=8266
;  --auth=esp-react


[env:esp32dev_tft]
; ESP32 DevKit V1 + 3.5" ILI9488 TFT (VSPI) — Remote Weight VIEWER.
; Renamed from espReadWriteRHYNO [env:esp32dev]; the trunk [env:esp32dev] is a
; separate generic troubleshooting board and is left UNCHANGED.
; The TFT screen reads weight from the receiver, so this env sets BOTH
; FT_REMOTE_WEIGHT and FT_TFT_WEIGHT_SCREEN. NEVER add FT_BOARD_ESP32_2432S028.
; Single-app layout (3.25MB, NO OTA): the trunk firmware is ~2.6MB, too big
; for dual-OTA 1.75MB slots on a 4MB board. Same constraint as nodemcu/
; firebeetle — flash over USB. (partitions_4mb_ota.csv is kept for any future
; sub-1.75MB build but is unused here.)
board_build.partitions = partitions_ble.csv
platform = espressif32@6.13.0
board = esp32dev
board_build.filesystem = littlefs
upload_protocol = esptool
upload_port = COM4
lib_deps =
  ${env.lib_deps}
  bodmer/TFT_eSPI@^2.5.43
build_flags =
  ${env.build_flags}
  -DCONFIG_ESP_TASK_WDT_TIMEOUT_S=10
  ; BLE OFF — free the single 2.4GHz radio for reliable WiFi on this 4MB board
  ; (TFT is display-only; BLE not used). Also shrinks flash by ~600KB.
  -D FT_BLE=0
  ; Remote-weight receiver + TFT screen (TFT hard-depends on the receiver).
  -D FT_REMOTE_WEIGHT=1
  -D FT_TFT_WEIGHT_SCREEN=1
  ; Serial1 -> GPIO25/26, Diagnostics -> GPIO33/32: off the display SPI pins.
  -DSERIAL2_RX_PIN=25
  -DSERIAL2_TX_PIN=26
  -DDIAG_RX_PIN=33
  -DDIAG_TX_PIN=32
  ; --- TFT_eSPI ILI9488 (VSPI) ---
  -DUSER_SETUP_LOADED=1
  -DILI9488_DRIVER=1
  -DTFT_WIDTH=320
  -DTFT_HEIGHT=480
  -DTFT_MISO=19
  -DTFT_MOSI=23
  -DTFT_SCLK=18
  -DTFT_CS=15
  -DTFT_DC=4
  -DTFT_RST=2
  -DTFT_BL=21
  -DTFT_BACKLIGHT_ON=HIGH
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DLOAD_FONT6=1
  -DLOAD_FONT7=1
  -DLOAD_FONT8=1
  -DLOAD_GFXFF=1
  -DSMOOTH_FONT=1
  -DSPI_FREQUENCY=4000000
  -DSPI_READ_FREQUENCY=4000000
  -DSPI_TOUCH_FREQUENCY=2500000
  -DTOUCH_CS=22


[env:cyd_tft]
; Sunton ESP32-2432S028 "Cheap Yellow Display" (CYD), 2.8" ILI9341 (HSPI) —
; Remote Weight VIEWER. Renamed from espReadWriteRHYNO [env:cyd28].
; This is the NEW TFT_eSPI viewer; firebeetle32 stays the BoardDisplayService
; CYD. NEVER set FT_TFT_WEIGHT_SCREEN and FT_BOARD_ESP32_2432S028 in one binary.
; Single-app layout (3.25MB, NO OTA) — trunk firmware ~2.6MB won't fit dual-OTA
; 1.75MB slots on this 4MB board. Flash over USB, same as the other 4MB envs.
board_build.partitions = partitions_ble.csv
platform = espressif32@6.13.0
board = esp32dev
board_build.filesystem = littlefs
; USB upload (set the COM port Windows assigns). OTA kept commented so a
; build-only sweep never tries to flash a live device.
upload_protocol = esptool
upload_port = COM4
;upload_protocol = espota
;upload_port = 192.168.2.88
;upload_flags =
;  --port=8266
;  --auth=esp-react
lib_deps =
  ${env.lib_deps}
  bodmer/TFT_eSPI@^2.5.43
build_flags =
  ${env.build_flags}
  -DCONFIG_ESP_TASK_WDT_TIMEOUT_S=10
  ; BLE OFF — free the single 2.4GHz radio for reliable WiFi on this 4MB board.
  -D FT_BLE=0
  -D FT_REMOTE_WEIGHT=1
  -D FT_TFT_WEIGHT_SCREEN=1
  ; Park unused UARTs off the CYD touch pins.
  -DSERIAL2_RX_PIN=22
  -DSERIAL2_TX_PIN=27
  -DDIAG_RX_PIN=4
  -DDIAG_TX_PIN=16
  ; --- TFT_eSPI ILI9341 — CYD pinout, HSPI ---
  -DUSER_SETUP_LOADED=1
  -DILI9341_DRIVER=1
  -DTFT_INVERT_DISPLAY=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DTFT_MISO=12
  -DTFT_MOSI=13
  -DTFT_SCLK=14
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=-1
  -DTFT_BL=21
  -DTFT_BACKLIGHT_ON=HIGH
  -DLOAD_GLCD=1
  -DLOAD_FONT2=1
  -DLOAD_FONT4=1
  -DLOAD_FONT6=1
  -DLOAD_FONT7=1
  -DLOAD_FONT8=1
  -DLOAD_GFXFF=1
  -DSMOOTH_FONT=1
  -DSPI_FREQUENCY=40000000
  -DSPI_READ_FREQUENCY=20000000
  -DSPI_TOUCH_FREQUENCY=2500000
  -DTOUCH_CS=33


[env:esp32dev_lcd]
; ESP32 DevKit V1 + I2C 16x2 character LCD (LiquidCrystal_I2C) — Character-LCD device.
; Single-app partitions_ble.csv (no OTA). BLE OFF: the LCD's BLE serial-bridge
; uses a blocking 5s scan; it compiles out when FT_BLE=0 — keep it off on 4MB.
board_build.partitions = partitions_ble.csv
platform = espressif32@6.13.0
board = esp32dev
board_build.filesystem = littlefs
upload_protocol = esptool
upload_port = COM4
build_flags =
  ${env.build_flags}
  -DCONFIG_ESP_TASK_WDT_TIMEOUT_S=10
  ; BLE OFF — what the comment above promised. Compiles out the LCD's blocking
  ; 5s BLE-bridge scan (a freeze hazard) AND frees the radio for WiFi on 4MB.
  -D FT_BLE=0
  -D FT_DISPLAY_LCD=1


[env:wsoft_waveshare43]
; W-Soft weigh screen: Waveshare ESP32-S3-Touch-LCD-4.3 + DJB-M1X junction box over RS485.
; Firmware logic is Weighsoft.WSoft esp/src @ cfcd012 (lib/wsoft_core, lib/wsoft_esp),
; exposed as framework services (src/examples/wsoft). Guide: docs/WSOFT-WAVESHARE43.md.
; - Arduino-ESP32 3.1.1 (pioarduino 53.03.11): ESP32_Display_Panel needs core 3.x.
;   The framework has only been built on core 2.0.x; this env is the core-3 spike.
; - Board json is the W-Soft copy: USB_CDC_ON_BOOT=0 so UART0 (CH343 USB port,
;   GPIO43/44) carries logs and the USB technician commands (HUB / APPROVAL).
; - RS485 is Serial1 RX15/TX16, owned by W-Soft. FT_WSOFT keeps the Serial1
;   services (Serial, Writer, Diagnostics, Weight Forwarder) out of this build.
; - Flash over USB: the factory OTA password is public, so framework OTA is off.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.11/platform-espressif32.zip
platform_packages =
  platformio/framework-arduinoespressif32@https://github.com/espressif/arduino-esp32.git#3.1.1
  platformio/framework-arduinoespressif32-libs@https://dl.espressif.com/AE/esp-arduino-libs/esp32-3.1.1-h.zip
board = waveshare-esp32-s3-touch-lcd-4_3
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
upload_protocol = esptool
upload_port = COM11
upload_speed = 460800
; Host tests run in [env:native], not on the board.
test_ignore = test_*
lib_deps =
  ArduinoJson@>=6.0.0,<7.0.0
  ; me-no-dev ESPAsyncWebServer/AsyncTCP do not target core 3; maintained forks.
  ; pinned to the versions the core-3 bench build resolved (26 Oct 2026)
  ESP32Async/AsyncTCP@3.5.0
  ESP32Async/ESPAsyncWebServer@3.12.1
  AsyncMqttClient@>=0.9.0,<1.0.0
  links2004/WebSockets@^2.5.4
  https://github.com/esp-arduino-libs/ESP32_Display_Panel.git#92b790ed6d24b0678e2f45b1fc85f0abd2d41b33
  https://github.com/esp-arduino-libs/ESP32_IO_Expander.git#v1.1.0
  https://github.com/esp-arduino-libs/esp-lib-utils.git#v0.2.0
  ; Local libs; named here because LDF does not find them on its own.
  wsoft_core
  wsoft_esp
; Clears the [env] lib_ignore: this is the one env that builds wsoft_esp.
lib_ignore =
build_flags =
  ${env.build_flags}
  -DCONFIG_ESP_TASK_WDT_TIMEOUT_S=10
  ; BLE shares the radio with Wi-Fi and is not used by W-Soft.
  -D FT_BLE=0
  -D FT_WSOFT=1
  ; hub.cpp hands Wi-Fi, NTP and OTA to the framework.
  -D WSOFT_ON_BASE
  ; The factory OTA password (esp-react) is public: OTA stays off until set on the device.
  ; Overrides factory_settings.ini (true); GCC warns "redefined", the last value wins.
  -D FACTORY_OTA_ENABLED=false
  ; No firmware upload from the web page either: the factory admin password is public,
  ; and approval switching must stay USB-only. Flash over USB. Same "redefined" warning.
  -D FT_UPLOAD_FIRMWARE=0
  ; --- W-Soft display (from Weighsoft.WSoft esp/platformio.ini) ---
  -DBOARD_HAS_PSRAM
  -DESP_PANEL_BOARD_DEFAULT_USE_SUPPORTED=1
  -DBOARD_WAVESHARE_ESP32_S3_TOUCH_LCD_4_3
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DCORE_DEBUG_LEVEL=1
  -I "$PROJECT_LIBDEPS_DIR/$PIOENV/ESP32_IO_Expander/src/chip"

[env:wsoft_waveshare43_ota]
; Same firmware as wsoft_waveshare43, flashed over Wi-Fi instead of USB.
; One-time on the device first: System > OTA Settings > Enable OTA Updates (port 8266).
; Office prototypes keep the factory OTA password; set a private one before any site install
; and change --auth to match.
extends = env:wsoft_waveshare43
upload_protocol = espota
upload_port = 192.168.1.10
upload_flags =
  --port=8266
  --auth=esp-react
  ; The ESP connects back to the laptop on this port; open it once in Windows Firewall.
  --host_port=8267

[env:native]
; Host unit tests for the W-Soft pure logic (lib/wsoft_core): pio test -e native
; Needs a host g++ on PATH. Builds no firmware and no web interface.
platform = native
framework =
test_framework = unity
extra_scripts =
build_src_filter = -<*>
lib_deps =
  wsoft_core
build_flags =
  -std=gnu++11
  -DUNITY_SUPPORT_64
