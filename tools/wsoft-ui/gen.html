<!doctype html>
<meta charset="utf-8">
<title>W-Soft screen generator</title>
<!-- Run by gen.mjs in a headless browser. Draws the letters with the browser's font engine,
     draws every test screen with them, and posts it all back to gen.mjs. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Sora:wght@800&display=block">
<script src="ref.js"></script>
<script>
(async () => {
  const U = WsoftUi;
  try {
    const wanted = ['700 11px Manrope', '800 13px Manrope', '800 54px Sora'];
    const loaded = await Promise.all(wanted.map((f) => document.fonts.load(f, 'Ag019')));
    loaded.forEach((faces, i) => { if (!faces.length) throw new Error('web font did not load: ' + wanted[i]); });
    const out = { fonts: {}, crc: {}, png: {}, theme: U.THEME, bar: U.BAR, roles: U.ROLES.map((r) => r.name),
      models: U.PRESETS.map(([title, , S]) => ({ title, model: U.modelOf(S) })) };
    for (const id of ['yellow', 'wave']) {
      const b = U.BOARDS[id];
      out.fonts[id] = U.buildFonts(b.sy).map(U.packFont);
      // Draw with the packed letters, so the checksums cover the packing too.
      const fonts = out.fonts[id].map(U.unpackFont);
      out.crc[id] = []; out.png[id] = [];
      for (const [, , S] of U.PRESETS) {
        const c = new U.Canvas(b.W, b.H, b.sx, b.sy, fonts);
        U.paint(c, U.modelOf(S));
        out.crc[id].push(U.crc32(c.fb));
        const cv = document.createElement('canvas');
        U.show(cv, c, 1);
        out.png[id].push(cv.toDataURL('image/png'));
      }
    }
    await fetch('/done', { method: 'POST', body: JSON.stringify(out) });
  } catch (e) {
    await fetch('/fail', { method: 'POST', body: String((e && e.stack) || e) });
  }
})();
</script>
